server:
  port: 9001

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: PRODUK
              uri: lb://PRODUK
              predicates:
                - Path=/produk/**
            - id: PRODUK-API
              uri: lb://PRODUK
              predicates:
                - Path=/api/produk/**
            - id: ORDER-SERVICE
              uri: lb://ORDER
              predicates:
                - Path=/order/**
            - id: ORDER-API
              uri: lb://ORDER
              predicates:
                - Path=/api/order/**
            - id: PELANGGAN-SERVICE
              uri: lb://PELANGGAN
              predicates:
                - Path=/pelanggan/**
            - id: PELANGGAN-API
              uri: lb://PELANGGAN
              predicates:
                - Path=/api/pelanggan/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
