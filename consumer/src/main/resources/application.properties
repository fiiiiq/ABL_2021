spring.application.name=consumer
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ===== Order email notification =====
app.rabbitmq.exchange=order.exchange
app.rabbitmq.email-queue=order.email.queue
app.rabbitmq.email-routing-key=order.email

# Retry 3x jika gagal kirim email, setelah itu pesan dibuang (tidak di-requeue terus-menerus)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3 
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

